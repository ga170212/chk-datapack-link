<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채팅 블록 소환 지원 블록 목록 (BLOCKS.md)</title>
    <!-- GitHub 공식 마크다운 스타일시트 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
    <!-- 마크다운 렌더러 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 100%;
            margin: 0;
            padding: 32px 48px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Pretendard", Helvetica, Arial, sans-serif;
        }

        .markdown-body {
            box-sizing: border-box;
            min-width: 100%;
            max-width: 100%;
            margin: 0 auto;
        }

        /* 모든 표의 세로 열 너비를 완벽하게 일치 (세로줄 정렬) */
        .markdown-body table {
            width: 100% !important;
            display: table !important;
            table-layout: fixed !important;
            margin-bottom: 24px;
        }

        /* 3열 테이블 (금지 블록, 주요 블록, 전체 블록) 세로선 완벽 일치 */
        .markdown-body th:nth-child(1),
        .markdown-body td:nth-child(1) {
            width: 32% !important;
        }

        .markdown-body th:nth-child(2),
        .markdown-body td:nth-child(2) {
            width: 32% !important;
        }

        .markdown-body th:nth-child(3),
        .markdown-body td:nth-child(3) {
            width: 36% !important;
        }

        /* 영문 전용 (2열 테이블) */
        .markdown-body table:has(th:nth-child(2):last-child) th:nth-child(1),
        .markdown-body table:has(th:nth-child(2):last-child) td:nth-child(1) {
            width: 50% !important;
        }
        .markdown-body table:has(th:nth-child(2):last-child) th:nth-child(2),
        .markdown-body table:has(th:nth-child(2):last-child) td:nth-child(2) {
            width: 50% !important;
        }

        @media (max-width: 768px) {
            body {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- 마크다운 본문 영역 -->
    <article id="content" class="markdown-body">
        <p>문서를 불러오는 중...</p>
    </article>

    <script>
        const MD_URL = 'https://raw.githubusercontent.com/ga170212/chk-datapack-link/main/example_datapacks/chat_block_rain/BLOCKS.md';
        const contentEl = document.getElementById('content');

        async function init() {
            let mdText = '';
            try {
                const res = await fetch(MD_URL, { cache: 'no-cache' });
                if (!res.ok) throw new Error('Fetch failed');
                mdText = await res.text();
            } catch (e) {
                try {
                    const localRes = await fetch('../example_datapacks/chat_block_rain/BLOCKS.md');
                    mdText = await localRes.text();
                } catch (err) {
                    contentEl.innerHTML = '<p>문서를 불러오지 못했습니다.</p>';
                    return;
                }
            }

            contentEl.innerHTML = marked.parse(mdText);
        }

        init();
    </script>
</body>
</html>
